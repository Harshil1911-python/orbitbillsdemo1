<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b3d91">
<title>Sign in · OrbitBills</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--white:#ffffff;--ink:#101a2b;--slate:#5b6b82;--blue-deep:#0b3d91;--blue:#2f6feb;--blue-tint:#eaf1fc;--blue-tint-2:#f5f8fe;--border:#dfe7f5;--radius:14px;--error:#c0392b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--blue-tint-2) 0%,var(--white) 60%);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;text-decoration:none;} img{max-width:100%;display:block;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--ink);margin-bottom:28px;}
  .brand-mark{height:34px;display:flex;align-items:center;flex-shrink:0;}
  .brand-mark img{height:100%;width:auto;display:block;}
  .auth-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:36px;box-shadow:0 20px 45px -20px rgba(11,61,145,0.2);}
  .auth-card h2{font-size:22px;font-weight:700;margin-bottom:6px;}
  .auth-card p.sub{font-size:14px;color:var(--slate);margin-bottom:24px;}
  .form-field{margin-bottom:18px;}
  .form-field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .pw-wrap{position:relative;display:flex;align-items:center}
  .pw-wrap input{padding-right:72px!important}
  .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#eaf1fc;color:var(--blue-deep);font-size:12px;font-weight:700;padding:8px 10px;border-radius:8px;cursor:pointer;font-family:inherit;min-height:36px}
  .pw-eye:active{opacity:.85}
  .form-field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:var(--white);}
  .form-field input:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:var(--blue-deep);color:#fff;margin-top:6px;}
  .btn:hover{background:#092f70;} .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .form-msg{font-size:13px;margin-top:14px;text-align:center;}
  .form-msg.error{color:var(--error);} .form-msg.success{color:#158a53;}
  .back-link{margin-top:22px;font-size:14px;color:var(--slate);text-align:center;}
  .back-link a{color:var(--blue-deep);font-weight:600;}

  /* Skeletal loading screen */
  #orbitBoot{
    display:none!important;position:fixed;inset:0;z-index:999999;
    background:#f5f8fe;
    flex-direction:column;align-items:stretch;justify-content:flex-start;
    padding:max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    overflow:hidden;
  }
  #orbitBoot.show{display:flex!important;}
  
  
  
  #orbitBoot .sk-line{
    height:14px;border-radius:8px;background:linear-gradient(90deg,#e8eef8 25%,#f5f8fe 50%,#e8eef8 75%);
    background-size:200% 100%;animation:skShimmer 1.2s ease-in-out infinite;
  }
  #orbitBoot .sk-card{
    background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  #orbitBoot .sk-row{display:flex;gap:10px;margin-bottom:12px;align-items:center;}
  #orbitBoot .sk-row:last-child{margin-bottom:0;}
  #orbitBoot .sk-avatar{width:44px;height:44px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(90deg,#e8eef8 25%,#f5f8fe 50%,#e8eef8 75%);background-size:200% 100%;
    animation:skShimmer 1.2s ease-in-out infinite;}
  #orbitBoot .sk-block{flex:1;display:flex;flex-direction:column;gap:8px;}
  #orbitBoot .sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  #orbitBoot .sk-tile{height:72px;border-radius:14px;
    background:linear-gradient(90deg,#e8eef8 25%,#f5f8fe 50%,#e8eef8 75%);background-size:200% 100%;
    animation:skShimmer 1.2s ease-in-out infinite;}
  
  @keyframes skShimmer{
    0%{background-position:200% 0}
    100%{background-position:-200% 0}
  }
</style>
</head>
<body>
  <a href="index.html" class="brand"><span class="brand-mark"><img src="logo.png" alt="Techserenia" onerror="this.style.display='none'"></span></a>
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Onboard OrbitBills By TechSerenia</p>
    <form id="loginForm">
      <div class="form-field"><label for="loginEmail">Work email</label>
        <input type="email" id="loginEmail" name="email" placeholder="Enter your work email" required autocomplete="username"></div>
      <div class="form-field"><label for="loginPassword">Password</label>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" name="password" placeholder="" required autocomplete="current-password">
          <button type="button" class="pw-eye" id="togglePassword" aria-label="Show password" title="Show password">Show</button>
        </div></div>
      <button type="submit" class="btn" id="loginSubmit">Sign in</button>
    </form>
    <div class="form-msg" id="loginMsg"></div>
    <div id="panelPicker" style="display:none;margin-top:18px">
      <p class="sub" style="margin-bottom:12px">Choose where to go</p>
      <button type="button" class="btn" data-go="/billing.html" style="margin-bottom:8px;background:#0b3d91">Billing</button>
      <button type="button" class="btn" data-go="/admin-dashboard.html" style="margin-bottom:8px;background:#2f6feb">Admin</button>
      <button type="button" class="btn" data-go="/accountant-dashboard.html" style="margin-bottom:8px;background:#158a53">Accountant</button>
    </div>
    <p style="font-size:11px;color:var(--slate);margin-top:14px;text-align:center;line-height:1.4">Demo login<br><strong>orbitbills@techserenia.com</strong><br>TechSerenia@2026</p>
    <div class="back-link"><a href="index.html">Back to home</a></div>
  </div>

  <div id="orbitBoot" class="show" aria-hidden="true">
  <div class="sk-grid">
    <div class="sk-tile"></div><div class="sk-tile" style="animation-delay:.12s"></div>
    <div class="sk-tile" style="animation-delay:.24s"></div><div class="sk-tile" style="animation-delay:.36s"></div>
  </div>
  <div class="sk-card">
    <div class="sk-row"><div class="sk-avatar"></div><div class="sk-block"><div class="sk-line" style="width:55%"></div><div class="sk-line" style="width:35%;height:10px"></div></div></div>
    <div class="sk-row"><div class="sk-avatar" style="animation-delay:.15s"></div><div class="sk-block"><div class="sk-line" style="width:48%"></div><div class="sk-line" style="width:30%;height:10px"></div></div></div>
    <div class="sk-row"><div class="sk-avatar" style="animation-delay:.3s"></div><div class="sk-block"><div class="sk-line" style="width:62%"></div><div class="sk-line" style="width:40%;height:10px"></div></div></div>
  </div>
  <div class="sk-card">
    <div class="sk-line" style="width:70%;margin-bottom:12px"></div>
    <div class="sk-line" style="width:100%;height:10px;margin-bottom:8px"></div>
    <div class="sk-line" style="width:88%;height:10px;margin-bottom:8px"></div>
    <div class="sk-line" style="width:55%;height:10px"></div>
  </div>
</div>
<script src="Db.js"></script>
<script>
  document.getElementById("togglePassword")?.addEventListener("click", function(){
    var input = document.getElementById("loginPassword");
    var btn = document.getElementById("togglePassword");
    if(!input) return;
    if(input.type === "password"){
      input.type = "text";
      if(btn){ btn.textContent = "Hide"; btn.setAttribute("aria-label","Hide password"); btn.title = "Hide password"; }
    } else {
      input.type = "password";
      if(btn){ btn.textContent = "Show"; btn.setAttribute("aria-label","Show password"); btn.title = "Show password"; }
    }
  });

  function showBoot(){
    var el = document.getElementById("orbitBoot");
    if(!el){
      document.body.insertAdjacentHTML("afterbegin", `<div id="orbitBoot" class="show" aria-hidden="true">
  <div class="sk-grid">
    <div class="sk-tile"></div><div class="sk-tile" style="animation-delay:.12s"></div>
    <div class="sk-tile" style="animation-delay:.24s"></div><div class="sk-tile" style="animation-delay:.36s"></div>
  </div>
  <div class="sk-card">
    <div class="sk-row"><div class="sk-avatar"></div><div class="sk-block"><div class="sk-line" style="width:55%"></div><div class="sk-line" style="width:35%;height:10px"></div></div></div>
    <div class="sk-row"><div class="sk-avatar" style="animation-delay:.15s"></div><div class="sk-block"><div class="sk-line" style="width:48%"></div><div class="sk-line" style="width:30%;height:10px"></div></div></div>
    <div class="sk-row"><div class="sk-avatar" style="animation-delay:.3s"></div><div class="sk-block"><div class="sk-line" style="width:62%"></div><div class="sk-line" style="width:40%;height:10px"></div></div></div>
  </div>
  <div class="sk-card">
    <div class="sk-line" style="width:70%;margin-bottom:12px"></div>
    <div class="sk-line" style="width:100%;height:10px;margin-bottom:8px"></div>
    <div class="sk-line" style="width:88%;height:10px;margin-bottom:8px"></div>
    <div class="sk-line" style="width:55%;height:10px"></div>
  </div>
</div>`);
      el = document.getElementById("orbitBoot");
    }
    if(el){
      el.classList.add("show");
      el.style.setProperty("display","flex","important");
      el.style.setProperty("pointer-events","auto","important");
    }
  }
  function hideBoot(){
    var el = document.getElementById("orbitBoot");
    if(el){
      el.classList.remove("show");
      el.style.setProperty("display","none","important");
    }
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("loginMsg");
    const submitBtn = document.getElementById("loginSubmit");
    msg.textContent = ""; msg.className = "form-msg"; submitBtn.disabled = true;
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    try {
      const data = await tsLogin(email, password);
      if (!data.ok) {
        msg.textContent = data.error || "Could not sign in.";
        msg.className = "form-msg error";
        submitBtn.disabled = false;
        return;
      }
      // Skeletal loader while warming IndexedDB, max 1.5s
      showBoot();
      const started = Date.now();
      try {
        if (typeof tsSeedDefaults === "function") await tsSeedDefaults();
        if (typeof tsGetAllSafe === "function") {
          await Promise.all([
            tsGetAllSafe("products").catch(function(){}),
            tsGetAllSafe("clients").catch(function(){}),
            tsGetAllSafe("settings").catch(function(){}),
            tsGetAllSafe("tax_slabs").catch(function(){}),
          ]);
        } else if (typeof tsLocalApi === "function") {
          await tsLocalApi("/pos-sync").catch(function(){});
        }
      } catch (warmErr) { /* continue */ }
      const elapsed = Date.now() - started;
      const wait = Math.max(0, Math.min(1200, 800 - elapsed < 0 ? 0 : 800 - elapsed));
      await new Promise(function(r){ setTimeout(r, wait); });
      // Uniform master account → panel picker (same login for all modes)
      if (data.uniform || (data.panels && data.panels.length)) {
        var boot = document.getElementById("orbitBoot");
        hideBoot();
        var picker = document.getElementById("panelPicker");
        if (picker) {
          picker.style.display = "block";
          submitBtn.disabled = false;
          msg.textContent = "Signed in — pick a panel";
          msg.className = "form-msg success";
          return;
        }
      }
      window.location.href = data.redirect || "/billing.html";
    } catch (err) {
      msg.textContent = "Something went wrong. Please try again.";
      msg.className = "form-msg error";
      submitBtn.disabled = false;
      var boot = document.getElementById("orbitBoot");
      if(boot) boot.classList.remove("show");
    }
  });
  document.querySelectorAll("#panelPicker [data-go]").forEach(function(btn){
    btn.addEventListener("click", function(){
      showBoot();
      window.location.href = btn.getAttribute("data-go");
    });
  });
  // Prefill master credentials for convenience
  try {
    var em = document.getElementById("loginEmail");
    var pw = document.getElementById("loginPassword");
    if (em && !em.value) em.value = "orbitbills@techserenia.com";
    if (pw && !pw.value) pw.placeholder = "TechSerenia@2026";
  } catch(e){}
  (async function () { await tsSeedDefaults().catch(() => {}); })();
</script>
</body>
</html>
