<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Sign in · OrbitBills</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--white:#ffffff;--ink:#101a2b;--slate:#5b6b82;--blue-deep:#0b3d91;--blue:#2f6feb;--blue-tint:#eaf1fc;--blue-tint-2:#f5f8fe;--border:#dfe7f5;--radius:14px;--error:#c0392b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--blue-tint-2) 0%,var(--white) 60%);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;text-decoration:none;} img{max-width:100%;display:block;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:var(--ink);margin-bottom:28px;}
  .brand-mark{height:34px;display:flex;align-items:center;flex-shrink:0;}
  .brand-mark img{height:100%;width:auto;display:block;}
  .auth-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:36px;box-shadow:0 20px 45px -20px rgba(11,61,145,0.2);}
  .auth-card h2{font-size:22px;font-weight:700;margin-bottom:6px;}
  .auth-card p.sub{font-size:14px;color:var(--slate);margin-bottom:24px;}
  .form-field{margin-bottom:18px;}
  .form-field label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;}
  .form-field input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-family:'Inter',sans-serif;font-size:16px;color:var(--ink);background:var(--white);-webkit-appearance:none;appearance:none;}
  .form-field input:focus{outline:2px solid var(--blue);outline-offset:1px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:var(--blue-deep);color:#fff;margin-top:6px;}
  .btn:hover{background:#092f70;} .btn:disabled{opacity:0.6;cursor:not-allowed;}
  .form-msg{font-size:13px;margin-top:14px;text-align:center;}
  .form-msg.error{color:var(--error);} .form-msg.success{color:#158a53;}
  .back-link{margin-top:22px;font-size:14px;color:var(--slate);text-align:center;}
  .back-link a{color:var(--blue-deep);font-weight:600;}
  .hint-box{margin-top:20px;padding:12px 14px;background:var(--blue-tint-2);border:1px dashed var(--border);border-radius:10px;font-size:12px;color:var(--slate);line-height:1.55;}
  .hint-box strong{color:var(--ink);}
</style>
</head>
<body>
  <a href="index.html" class="brand"><span class="brand-mark"><img src="logo.png" alt="Techserenia" onerror="this.style.display='none'"></span></a>
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Onboard OrbitBills By TechSerenia</p>
    <form id="loginForm">
      <div class="form-field"><label for="loginEmail">Work email</label>
        <input type="email" id="loginEmail" name="email" placeholder="Enter your work email" required autocomplete="username"></div>
      <div class="form-field"><label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" placeholder="" required autocomplete="current-password"></div>
      <button type="submit" class="btn" id="loginSubmit">Sign in</button>
    </form>
    <div class="form-msg" id="loginMsg"></div>
    <div class="back-link"><a href="index.html">Back to home</a></div>
  </div>
<script src="Db.js"></script>
<script>
    function resolveRedirect(path){
    if(!path) path = "billing.html";
    // Prefer relative paths so mobile browsers work on any host/path
    if(path.startsWith("/")) path = path.slice(1);
    try{
      return new URL(path, window.location.href).href;
    }catch(e){
      return path;
    }
  }
  function storageOk(){
    try{
      var k = "__orbit_test__";
      localStorage.setItem(k, "1");
      localStorage.removeItem(k);
      return true;
    }catch(e){ return false; }
  }
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    e.stopPropagation();
    const msg = document.getElementById("loginMsg");
    const submitBtn = document.getElementById("loginSubmit");
    msg.textContent = ""; msg.className = "form-msg"; submitBtn.disabled = true;
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    if(!email || !password){
      msg.textContent = "Enter email and password."; msg.className = "form-msg error"; submitBtn.disabled = false; return;
    }
    if(!storageOk()){
      msg.textContent = "This browser is blocking storage (Private mode?). Allow site data or use the OrbitBills app.";
      msg.className = "form-msg error"; submitBtn.disabled = false; return;
    }
    if(typeof tsLogin !== "function"){
      msg.textContent = "App database not loaded. Check your connection and refresh.";
      msg.className = "form-msg error"; submitBtn.disabled = false; return;
    }
    try {
      if(typeof tsSeedDefaults === "function") await tsSeedDefaults().catch(function(){});
      const data = await tsLogin(email, password);
      if (!data || !data.ok) {
        msg.textContent = (data && data.error) || "Could not sign in.";
        msg.className = "form-msg error"; submitBtn.disabled = false; return;
      }
      msg.textContent = "Signed in — opening…"; msg.className = "form-msg";
      var dest = resolveRedirect(data.redirect || "billing.html");
      // Small delay helps some mobile browsers flush localStorage before navigation
      setTimeout(function(){ window.location.assign(dest); }, 80);
    } catch (err) {
      console.error(err);
      var m = (err && err.message) ? String(err.message) : "Something went wrong";
      if(/crypto|subtle|secure/i.test(m)) m = "Secure context required. Open the site with HTTPS.";
      if(/indexeddb|idb|database/i.test(m)) m = "Browser blocked the local database. Disable private mode or allow site data.";
      msg.textContent = m; msg.className = "form-msg error"; submitBtn.disabled = false;
    }
  });
  (async function () {
    try{
      if(typeof tsSeedDefaults === "function") await tsSeedDefaults();
    }catch(e){
      var msg = document.getElementById("loginMsg");
      if(msg){ msg.textContent = "Could not prepare local data. Try HTTPS or exit private browsing."; msg.className = "form-msg error"; }
    }
  })();
</script>
</body>
</html>
