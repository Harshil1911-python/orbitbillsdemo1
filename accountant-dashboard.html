<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accountant · OrbitBills</title>
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--brand:#0b3d91;--ok:#15803d;--bad:#b91c1c;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:"Space Grotesk",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.brand{font-weight:700}.brand span{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:22px;font-weight:700;font-family:"Space Grotesk",sans-serif;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase}
.btn{display:inline-flex;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;color:var(--brand)}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.pill.paid{background:#dcfce7;color:var(--ok)}.pill.unpaid{background:#fee2e2;color:var(--bad)}.pill.partial{background:#fef3c7;color:#a16207}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
</style>
</head>
<body>
<header>
  <div class="brand">OrbitBills <span>Accountant</span></div>
  <div>
    <button class="btn" id="btnRefresh" type="button">Refresh</button>
    <button class="btn" id="signOutBtn" type="button">Sign out</button>
  </div>
</header>
<div class="wrap">
  <div class="stat-grid">
    <div class="stat"><div class="label">Invoices</div><div class="value" id="sInvoices">0</div></div>
    <div class="stat"><div class="label">Revenue</div><div class="value" id="sRevenue">₹0</div></div>
    <div class="stat"><div class="label">Unpaid</div><div class="value" id="sUnpaid">₹0</div></div>
    <div class="stat"><div class="label">Margin (30d)</div><div class="value" id="sMargin">₹0</div></div>
  </div>
  <div class="card">
    <div class="toolbar">
      <h3 style="flex:1;margin:0">Day close</h3>
      <input type="date" id="dayDate">
      <button class="btn btn-primary" id="btnDay" type="button">Load</button>
    </div>
    <div id="dayBody" style="font-size:13px;color:var(--muted)">Pick a date.</div>
  </div>
  <div class="card">
    <h3>Recent invoices</h3>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Number</th><th>Client</th><th>Total</th><th>Paid</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="invBody"></tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="toolbar">
      <h3 style="flex:1;margin:0">Profit margin</h3>
      <select id="marginDays"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select>
      <button class="btn" id="btnMargin" type="button">Refresh</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Product</th><th>Sold</th><th>Revenue</th><th>Cost</th><th>Margin</th><th>%</th></tr></thead>
        <tbody id="marginBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="Db.js"></script>
<script>
function money(n){ return "₹" + Number(n||0).toFixed(2); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function pill(st){ return `<span class="pill ${esc(st)}">${esc(st)}</span>`; }
async function load(){
  const who = tsWhoami();
  if (!who.ok || (who.role !== "accountant" && who.role !== "admin")) { location.href = "/signin.html"; return; }
  const inv = await tsLocalApi("/invoices");
  const invoices = inv.invoices || [];
  const revenue = invoices.reduce((s,i)=>s+(Number(i.total)||0),0);
  const unpaid = invoices.filter(i=>i.status==="unpaid"||i.status==="partial")
    .reduce((s,i)=>s+Math.max(0,(Number(i.total)||0)-(Number(i.amount_paid)||0)),0);
  document.getElementById("sInvoices").textContent = invoices.length;
  document.getElementById("sRevenue").textContent = money(revenue);
  document.getElementById("sUnpaid").textContent = money(unpaid);
  document.getElementById("invBody").innerHTML = invoices.slice(0,50).map(i=>`
    <tr><td>${esc(i.invoice_number)}</td><td>${esc(i.client_name||"Walk-in")}</td>
    <td>${money(i.total)}</td><td>${money(i.amount_paid||0)}</td>
    <td>${pill(i.status)}</td><td>${esc((i.created_at||"").slice(0,10))}</td></tr>`).join("") || `<tr><td colspan="6">No invoices yet</td></tr>`;
  const m = await tsLocalApi("/reports/profit-margin?days="+document.getElementById("marginDays").value);
  document.getElementById("sMargin").textContent = money(m.totalMargin||0);
  document.getElementById("marginBody").innerHTML = (m.products||[]).filter(p=>p.soldQty>0).map(p=>`
    <tr><td>${esc(p.name)}</td><td>${p.soldQty}</td><td>${money(p.revenue)}</td>
    <td>${money(p.cost)}</td><td>${money(p.margin)}</td><td>${p.marginPct!=null?p.marginPct+"%":"—"}</td></tr>`).join("")
    || `<tr><td colspan="6">No sales in window</td></tr>`;
}
async function loadDay(){
  const day = document.getElementById("dayDate").value || new Date().toISOString().slice(0,10);
  const d = await tsLocalApi("/reports/day-close?date="+encodeURIComponent(day));
  if (!d.ok) { document.getElementById("dayBody").textContent = d.error||"Failed"; return; }
  const methods = Object.entries(d.byPaymentMethod||{}).map(([k,v])=>`${k}: ${money(v)}`).join(" · ") || "—";
  document.getElementById("dayBody").innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:8px">
      <div><div style="color:var(--muted);font-size:11px">Invoices</div><strong>${d.invoiceCount}</strong></div>
      <div><div style="color:var(--muted);font-size:11px">Sales</div><strong>${money(d.totalSales)}</strong></div>
      <div><div style="color:var(--muted);font-size:11px">Paid</div><strong>${money(d.paid)}</strong></div>
      <div><div style="color:var(--muted);font-size:11px">Unpaid</div><strong>${money(d.unpaid)}</strong></div>
      <div><div style="color:var(--muted);font-size:11px">Net</div><strong>${money(d.netSales)}</strong></div>
    </div>
    <div style="color:var(--muted)">Payments: ${esc(methods)}</div>`;
}
document.getElementById("btnRefresh").onclick = load;
document.getElementById("btnMargin").onclick = load;
document.getElementById("btnDay").onclick = loadDay;
document.getElementById("signOutBtn").onclick = () => { tsLogout(); location.href="/signin.html"; };
document.getElementById("dayDate").value = new Date().toISOString().slice(0,10);
tsOnSync(() => load());
(async () => { await tsSeedDefaults(); await load(); await loadDay(); })();
</script>
</body>
</html>
